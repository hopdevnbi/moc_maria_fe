name: One-time Event UI format
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/event-format-once.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format event UI only
        run: |
          npx prettier --write src/features/gift-events-admin/event-console.css src/features/gift-events-admin/event-console.tsx src/features/gift-events/gift-counter.tsx src/features/gift-events/gift-qr-scanner.tsx
          git diff --check
      - name: Commit reviewed formatting to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/gift-events-admin/event-console.css src/features/gift-events-admin/event-console.tsx src/features/gift-events/gift-counter.tsx src/features/gift-events/gift-qr-scanner.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style(event): format event console and counter source"
            git push origin HEAD:main
          fi
