<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720" role="img" aria-labelledby="title desc">
<title id="title">Hộp quà Mộc Maria — dao-nhat</title><desc id="desc">Minh họa hộp quà xanh botanical với nơ satin màu vàng, không thể hiện nội dung giải thưởng.</desc>
<defs>
  <radialGradient id="halo"><stop stop-color="#fdf7dd" stop-opacity=".34"/><stop offset="1" stop-color="#fffaf0" stop-opacity="0"/></radialGradient>
  <linearGradient id="body" x1=".04" y1=".06" x2=".94" y2="1"><stop stop-color="#efc4ae"/><stop offset=".53" stop-color="#b37866"/><stop offset="1" stop-color="#b37866"/></linearGradient>
  <linearGradient id="lid" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#efc4ae"/><stop offset="1" stop-color="#b37866"/></linearGradient>
  <linearGradient id="ribbon"><stop stop-color="#b88b44"/><stop offset=".35" stop-color="#ffe4ae"/><stop offset=".66" stop-color="#fff4d2"/><stop offset="1" stop-color="#bb904d"/></linearGradient>
  <filter id="shadow"><feGaussianBlur stdDeviation="22"/></filter>
</defs>
