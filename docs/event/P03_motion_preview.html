<!doctype html><html lang="vi"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>P03 · Motion study · Mộc Maria (mô phỏng)</title><style>
:root{color-scheme:light;font-family:Arial,system-ui,sans-serif;color:#163e32;background:#f8f7f0}*{box-sizing:border-box}body{margin:0}
.wrap{width:min(960px,calc(100% - 28px));margin:40px auto}.eyebrow{color:#957b4a;letter-spacing:2px;font-size:11px;font-weight:800}h1{font:normal clamp(30px,5vw,48px) Georgia,serif}.note{font-size:12px;color:#8b7359}
.stage{background:radial-gradient(circle at 50% 30%,#366a56,#10372a);border-radius:24px;color:#f9edcd;min-height:360px;padding:35px;display:flex;align-items:center;flex-direction:column;justify-content:center;overflow:hidden}
.present{width:208px;height:205px;position:relative;margin:20px auto 25px;transition:transform .2s}.present img{display:block;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 13px 17px #091b16aa)}
.present:after{content:"";position:absolute;width:75px;height:20px;left:65px;top:42px;background:linear-gradient(90deg,#d4ab61,#ffe3a5,#d6ac62);border-radius:6px;transition:transform .65s cubic-bezier(.16,.84,.28,1),opacity .4s;opacity:0}
.present.focus{transform:translateY(-13px) scale(1.07)}.present.open:after{opacity:.9;transform:translateY(-76px) rotate(-15deg)}.present.open img{filter:drop-shadow(0 0 42px #f3dca18c)}
.present.done{opacity:.25}.controls{display:flex;flex-wrap:wrap;gap:10px}.controls button{padding:12px 21px;background:#f2e4c4;color:#153b30;border:0;border-radius:12px;font-weight:700;cursor:pointer}.controls button:disabled{opacity:.45;cursor:not-allowed}
.result{display:none;border:1px solid #e4d2ab;background:#fff9ed;color:#3f5d46;border-radius:20px;padding:24px;margin-top:16px;text-align:center}.result h2{font:normal 30px Georgia,serif}.result.show{display:block}
button:focus-visible{outline:3px solid #d7a764;outline-offset:3px}
@media(max-width:480px){.wrap{margin:20px auto}.stage{min-height:300px;padding:18px;border-radius:18px}.present{width:175px;height:175px}.present:after{left:50px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><div class="wrap"><span class="eyebrow">MỘC MARIA · PROTOTYPE P03</span><h1>Một khoảnh khắc mở quà thật dịu dàng</h1><p class="note">MÔ PHỎNG · KHÔNG TRAO QUÀ · KHÔNG KẾT NỐI TÀI KHOẢN</p><div class="stage"><div class="present" id="present"><img alt="Hộp quà minh họa" src="../../public/event/gift-boxes/gift-1.svg"/></div><div class="controls"><button id="start">Thử hiệu ứng</button><button id="skip">Bỏ qua hiệu ứng</button></div><p aria-live="polite" id="live">Sẵn sàng xem thử animation</p></div><div class="result" id="result" role="status"><span class="eyebrow">KẾT QUẢ MÔ PHỎNG — KHÔNG CÓ GIÁ TRỊ SỬ DỤNG</span><h2>Yêu thương gửi đến bạn</h2><p>Voucher trang trí để duyệt giao diện; không phải quà được cấp thực.</p><button id="reset">Xem lại</button></div></div><script>
const box=document.querySelector('#present'),result=document.querySelector('#result'),live=document.querySelector('#live'),start=document.querySelector('#start');let timers=[];
function clear(){timers.forEach(clearTimeout);timers=[];}
function reveal(){clear();box.className='present done';result.classList.add('show');live.textContent='Đã hoàn tất mô phỏng';start.disabled=false;}
function begin(){clear();result.classList.remove('show');start.disabled=true;box.className='present focus';live.textContent='Đang focus hộp quà';if(matchMedia('(prefers-reduced-motion: reduce)').matches){reveal();return}timers.push(setTimeout(()=>{box.className='present focus open';live.textContent='Nắp hộp đang mở';},200));timers.push(setTimeout(reveal,1350));}
start.addEventListener('click',begin);document.querySelector('#skip').addEventListener('click',reveal);document.querySelector('#reset').addEventListener('click',()=>{clear();box.className='present';result.classList.remove('show');live.textContent='Sẵn sàng xem thử animation';start.disabled=false;});
</script></body></html>
